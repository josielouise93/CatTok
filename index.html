<!DOCTYPE html>
<html>

<head>

<title>🐱 CatTok</title>

<style>

*{
box-sizing:border-box;
font-family:Arial;
}

body{
margin:0;
background:#ffe6f2;
transition:.3s;
}


.dark{
background:#17121c;
color:white;
}


header{
background:white;
padding:20px;
text-align:center;
position:sticky;
top:0;
z-index:5;
}


.dark header{
background:#292033;
}


h1{
font-size:45px;
color:#ff4fa3;
}


input, textarea{

padding:12px;
border-radius:20px;
border:2px solid pink;
margin:5px;

}


button{

background:#ff4fa3;
color:white;
border:0;
padding:10px 15px;
border-radius:20px;
cursor:pointer;

}


button:hover{

transform:scale(1.1);

}


.feed{

display:flex;
flex-direction:column;
align-items:center;
gap:30px;
padding:30px;

}



.cat{

background:white;
width:360px;
border-radius:25px;
overflow:hidden;
box-shadow:0 10px 20px #0003;

}


.dark .cat{

background:#292033;

}



.cat img{

width:100%;
height:350px;
object-fit:cover;

}



.info{

padding:15px;

}


.name{

font-size:28px;
color:#ff4fa3;

}


.badge{

background:#ffd1e8;
padding:5px;
border-radius:10px;

}


#dex{

text-align:center;
font-size:20px;

}



#uploadBox{

text-align:center;
padding:20px;

}


.messageBox{

display:none;
padding:15px;

}


.message{

background:#eee;
padding:10px;
border-radius:15px;
margin-top:10px;

}


.dark .message{

background:#443650;

}


</style>

</head>



<body>


<header>


<h1>🐱 CatTok</h1>


<input id="search"
placeholder="Search cats..."
onkeyup="searchCats()">



<br>


<button onclick="toggleDark()">
🌙
</button>


<button onclick="openUpload()">
➕ Add Cat
</button>



</header>




<div id="dex">

🐾 CatDex:
<span id="count">0</span>

</div>



<div id="uploadBox"
style="display:none">


<h2>Create your cat!</h2>


<input id="catName"
placeholder="Cat name">


<br>


<input type="file"
id="catImage"
accept="image/*">


<br>


<textarea id="catBio"
placeholder="Funny cat bio"></textarea>


<br>


<button onclick="createCat()">
Create 🐱
</button>



</div>





<div class="feed" id="feed">



</div>




<script>



let collected=0;


let cats=[];




function openUpload(){

let box=document.getElementById("uploadBox");

if(box.style.display=="none"){

box.style.display="block";

}

else{

box.style.display="none";

}

}




function createCat(){


let name=document.getElementById("catName").value;

let bio=document.getElementById("catBio").value;


let file=document.getElementById("catImage").files[0];



if(!name || !file){

alert("Add a name and photo!");

return;

}



let reader=new FileReader();


reader.onload=function(e){


addCatCard(
name,
bio,
e.target.result
);


};


reader.readAsDataURL(file);



}




function addCatCard(name,bio,img){


let card=document.createElement("div");

card.className="cat";



card.innerHTML=`

<img src="${img}">


<div class="info">


<div class="name">
${name} 🐱
</div>


<p>${bio}</p>


<span class="badge">
✨ New Cat Star
</span>


<br><br>


<button onclick="collectCat(this)">
⭐ Collect
</button>



<div class="messageBox">


<textarea placeholder="Message owner..."></textarea>


<button onclick="sendMessage(this)">
Send 💌
</button>


<div class="messages"></div>



</div>



</div>

`;



document.getElementById("feed").prepend(card);



}



function collectCat(button){


collected++;


document.getElementById("count").innerHTML=collected;



let box=
button.parentElement.querySelector(".messageBox");


box.style.display="block";


button.innerHTML="⭐ Collected";

button.disabled=true;


}



function sendMessage(button){


let area=
button.parentElement.querySelector("textarea");


let text=area.value;


if(text){


let msg=document.createElement("div");

msg.className="message";


msg.innerHTML="💬 "+text;


button.parentElement.querySelector(".messages")
.appendChild(msg);


area.value="";


}


}




function toggleDark(){

document.body.classList.toggle("dark");

}




function searchCats(){


let text=
document.getElementById("search")
.value.toLowerCase();


let cards=
document.querySelectorAll(".cat");



cards.forEach(card=>{


if(card.innerText.toLowerCase().includes(text)){


card.style.display="block";


}

else{


card.style.display="none";


}


});


}





// starter cats


addCatCard(

"Mochi",

"🍞 Professional loaf who steals blankets",

"https://placecats.com/500/500"

);



addCatCard(

"Beans",

"⚡ Zoomie champion and box destroyer",

"https://placecats.com/501/501"

);



</script>


</body>

</html>
